[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = { workspace = true }
log = { workspace = true }
num-traits = { version = "0.2.19", default-features = false }
widestring = { workspace = true }
zerocopy = { workspace = true }

# These optional dependencies are used by an external project that
# reuses some of this code in a web context.
schemars = { optional = true, version = "1.2" }
serde = { optional = true, version = "1.0" }
ts-rs = { optional = true, version = "12.0.1" }

# Alternative allocator, used when targeting wasm.
wee_alloc = { optional = true, version = "0.4.5" }

[features]
wasm = ["dep:wee_alloc"]
serde = ["dep:serde", "dep:ts-rs", "dep:schemars"]
