[package]
name = "winapi-exe"
version = "0.1.0"
edition = "2024"

[lib]
name = "winapi_lib"
crate-type = ["cdylib"]

[dependencies]
host = { workspace = true }
runtime = { workspace = true }
winapi = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { workspace = true }

[features]
wasm_worker = ['host/wasm_worker']
